    <style>
        /* 기본 스타일 초기화 및 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* 타이틀 */
        h1 {
            margin-top: 40px;
            font-size: 24px;
            font-weight: bold;
        }

        /* 진행률 표시 바 */
        .progress-container {
            width: 90%;
            max-width: 500px;
            margin: 10px 0 30px 0;
            text-align: center;
        }
        .progress-bar-bg {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .progress-bar-fill {
            background-color: #333;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 14px;
            color: #666;
        }

        /* 메인 소트 영역 */
        .sort-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 앨범 카드 디자인 */
        .card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .card:active {
            transform: scale(0.95);
        }
        .card img {
            width: 100%;
            aspect-ratio: 16 / 9; /* 유튜브 썸네일 비율에 맞게 수정 */
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: #ddd;
        }
        .card .tmapEpisode-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
        }

        .vs-text {
            font-size: 20px;
            font-weight: bold;
            color: #888;
        }

        /* 하단 액션 버튼 영역 */
        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
            justify-content: center;
        }
        
        button {
            background: white;
            border: 1px solid #ddd;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            flex: 1;
            max-width: 150px;
            transition: background 0.2s;
        }
        button:active {
            background: #f0f0f0;
        }

        /* 결과창 테이블 디자인 */
        #result-container {
            display: none;
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fc;
            font-weight: bold;
        }
        .rank-col {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .restart-btn {
            display: block;
            margin: 20px auto 0;
            background-color: #333;
            color: white;
            border: none;
        }
    </style>

        let nrec;
        let numQuestion;
        let totalSize;
        let finishSize;
        let finishFlag = 0;
        
        // 이전 단계 복구를 위한 히스토리 배열
        let historyState = [];

        // 초기화 함수
        function initList() {
            let n = 0;
            let mid;
            let i;

            lstMember[n] = [];
            for (i = 0; i < tmapEpisodes.length; i++) {
                lstMember[n][i] = i;
            }
            parent[n] = -1;
            totalSize = 0;
            n++;

            for (i = 0; i < lstMember.length; i++) {
                if(lstMember[i].length >= 2) {
                    mid = Math.ceil(lstMember[i].length / 2);
                    lstMember[n] = lstMember[i].slice(0, mid);
                    totalSize += lstMember[n].length;
                    parent[n] = i;
                    n++;
                    lstMember[n] = lstMember[i].slice(mid, lstMember[i].length);
                    totalSize += lstMember[n].length;
                    parent[n] = i;
                    n++;
                }
            }

            for (i = 0; i < tmapEpisodes.length; i++) {
                rec[i] = 0;
            }
            nrec = 0;

            for (i = 0; i <= tmapEpisodes.length; i++) {
                equal[i] = -1;
            }

            cmp1 = lstMember.length - 2;
            cmp2 = lstMember.length - 1;
            head1 = 0;
            head2 = 0;
            numQuestion = 1;
            finishSize = 0;
            finishFlag = 0;
        }

        // 현재 상태를 기록 (Undo용)
        function saveState() {
            historyState.push({
                lstMember: JSON.parse(JSON.stringify(lstMember)),
                parent: [...parent],
                equal: [...equal],
                rec: [...rec],
                cmp1: cmp1, cmp2: cmp2,
                head1: head1, head2: head2,
                nrec: nrec,
                numQuestion: numQuestion,
                finishSize: finishSize,
                finishFlag: finishFlag
            });
        }

        // 선택지 클릭 로직 연결
        function selectOption(choice) {
            if (finishFlag === 1) return;
            
            saveState(); // 선택 전 현재 상태 저장
            
            if (choice === 'left') sortList(-1);
            else if (choice === 'right') sortList(1);
            else if (choice === 'both') sortList(0);
        }

        // 병합 정렬 알고리즘 핵심 로직
        function sortList(flag) {
            let i;

            if (flag < 0) {
                rec[nrec] = lstMember[cmp1][head1];
                head1++; nrec++; finishSize++;
                while (equal[rec[nrec-1]] != -1) {
                    rec[nrec] = lstMember[cmp1][head1];
                    head1++; nrec++; finishSize++;
                }
            } else if (flag > 0) {
                rec[nrec] = lstMember[cmp2][head2];
                head2++; nrec++; finishSize++;
                while (equal[rec[nrec-1]] != -1) {
                    rec[nrec] = lstMember[cmp2][head2];
                    head2++; nrec++; finishSize++;
                }
            } else {
                rec[nrec] = lstMember[cmp1][head1];
                head1++; nrec++; finishSize++;
                while (equal[rec[nrec-1]] != -1) {
                    rec[nrec] = lstMember[cmp1][head1];
                    head1++; nrec++; finishSize++;
                }
                equal[rec[nrec-1]] = lstMember[cmp2][head2];
                rec[nrec] = lstMember[cmp2][head2];
                head2++; nrec++; finishSize++;
                while (equal[rec[nrec-1]] != -1) {
                    rec[nrec] = lstMember[cmp2][head2];
                    head2++; nrec++; finishSize++;
                }
            }

            if (head1 < lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
                while (head1 < lstMember[cmp1].length){
                    rec[nrec] = lstMember[cmp1][head1];
                    head1++; nrec++; finishSize++;
                }
            } else if (head1 == lstMember[cmp1].length && head2 < lstMember[cmp2].length) {
                while (head2 < lstMember[cmp2].length){
                    rec[nrec] = lstMember[cmp2][head2];
                    head2++; nrec++; finishSize++;
                }
            }

            if (head1 == lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
                for (i = 0; i < lstMember[cmp1].length + lstMember[cmp2].length; i++) {
                    lstMember[parent[cmp1]][i] = rec[i];
                }
                lstMember.pop();
                lstMember.pop();
                cmp1 = cmp1 - 2;
                cmp2 = cmp2 - 2;
                head1 = 0;
                head2 = 0;

                if (head1 == 0 && head2 == 0) {
                    for (i = 0; i < tmapEpisodes.length; i++) {
                        rec[i] = 0;
                    }
                    nrec = 0;
                }
            }

            if (cmp1 < 0) {
                finishFlag = 1;
                showResult();
            } else {
                updateUI();
            }
        }

        // 이전 선택 취소 기능
        function undo() {
            if (historyState.length === 0) {
                alert("첫 번째 매치입니다! 아직 취소할 항목이 없어요.");
                return;
            }
            
            // 이전 상태 불러오기
            const prevState = historyState.pop();
            lstMember = prevState.lstMember;
            parent = prevState.parent;
            equal = prevState.equal;
            rec = prevState.rec;
            cmp1 = prevState.cmp1;
            cmp2 = prevState.cmp2;
            head1 = prevState.head1;
            head2 = prevState.head2;
            nrec = prevState.nrec;
            numQuestion = prevState.numQuestion;
            finishSize = prevState.finishSize;
            finishFlag = prevState.finishFlag;
            
            updateUI();
        }

        // 화면 갱신 (진행률 및 카드 이미지 렌더링)
        function updateUI() {
            const percent = Math.floor(finishSize * 100 / totalSize);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').innerText = `진행률 : ${percent}% (매치 ${numQuestion})`;

            const idx1 = lstMember[cmp1][head1];
            const idx2 = lstMember[cmp2][head2];

            document.getElementById('leftTitle').innerText = tmapEpisodes[idx1].title;
            document.getElementById('leftImg').src = tmapEpisodes[idx1].img;
            
            document.getElementById('rightTitle').innerText = tmapEpisodes[idx2].title;
            document.getElementById('rightImg').src = tmapEpisodes[idx2].img;

            numQuestion++;
        }

        // 최종 결과 출력
        function showResult() {
            // 소트 UI 감추기
            document.getElementById('sort-area').style.display = 'none';
            document.getElementById('action-area').style.display = 'none';
            document.getElementById('progressText').innerText = "분석 완료!";
            document.getElementById('progressFill').style.width = '100%';

            // 결과창 보이기
            document.getElementById('result-container').style.display = 'block';

            let ranking = 1;
            let sameRank = 1;
            let str = "<table><tr><th class='rank-col'>순위</th><th>에피소드 제목</th></tr>";

            for (let i = 0; i < tmapEpisodes.length; i++) {
                str += `<tr><td class='rank-col'>${ranking}위</td><td>${tmapEpisodes[lstMember[0][i]].title}</td></tr>`;
                
                if (i < tmapEpisodes.length - 1) {
                    if (equal[lstMember[0][i]] == lstMember[0][i+1]) {
                        sameRank++;
                    } else {
                        ranking += sameRank;
                        sameRank = 1;
                    }
                }
            }
            str += "</table>";
            
            document.getElementById('result-table').innerHTML = str;
        }

        // 시작 시 초기화
        window.onload = function() {
            initList();
            updateUI();
        };
    </script>
</body>
</html>
